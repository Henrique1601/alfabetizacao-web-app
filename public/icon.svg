<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado estilo ícone de app móvel -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)"/>

  <!-- Bloco Voxel / Minecraft Central -->
  <g transform="translate(106, 120)">
    <!-- Terra / Base -->
    <rect x="0" y="70" width="300" height="200" rx="16" fill="url(#dirtGrad)" stroke="#451a03" stroke-width="12"/>
    
    <!-- Grama / Topo -->
    <rect x="0" y="0" width="300" height="90" rx="16" fill="url(#grassGrad)" stroke="#14532d" stroke-width="12"/>
    <!-- Detalhes de grama pendurada -->
    <polygon points="30,90 45,125 60,90" fill="#16a34a"/>
    <polygon points="100,90 120,135 140,90" fill="#16a34a"/>
    <polygon points="180,90 200,130 220,90" fill="#16a34a"/>
    <polygon points="245,90 260,120 275,90" fill="#16a34a"/>

    <!-- Letra 'A' estilizada em pixel/craft no centro do bloco -->
    <text x="150" y="210" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="140" fill="#fef08a" text-anchor="middle" stroke="#78350f" stroke-width="6">
      A
    </text>
  </g>

  <!-- Brilho / Estrela de XP -->
  <circle cx="410" cy="110" r="28" fill="#facc15" stroke="#ca8a04" stroke-width="6"/>
  <circle cx="100" cy="90" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="4"/>
</svg>
